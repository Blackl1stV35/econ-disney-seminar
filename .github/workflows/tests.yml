name: tests

# Tests of the Disney project on every pull request that touches it.
# A run of the notebooks on the dataset takes about an hour and is too long for an automatic check; run it locally.
on:
  pull_request:
    paths:
      - "disney-tourism-thailand/**"
      - ".github/workflows/tests.yml"
  push:
    branches: [main]
    paths:
      - "disney-tourism-thailand/**"
      - ".github/workflows/tests.yml"

permissions:
  contents: read

jobs:
  disney-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: disney-tourism-thailand
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: disney-tourism-thailand/requirements.txt
      - name: Install the requirements
        run: python -m pip install -r requirements.txt
      - name: Run the tests
        run: python -m pytest -q -p no:cacheprovider
